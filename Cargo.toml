[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/eclipse-opensovd/uds2sovd-proxy"

[workspace]
resolver = "3"
members = [
  "proxy-core",
]

[workspace.dependencies]
proxy-core = { path = "proxy-core" }
proxy-doip = { path = "proxy-doip" }
proxy-sovd = { path = "proxy-sovd" }
cda-core = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "ed58d5f9524f483c3f9409a1a79a12ab8261568c" }
cda-database = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "ed58d5f9524f483c3f9409a1a79a12ab8261568c" }
cda-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "ed58d5f9524f483c3f9409a1a79a12ab8261568c" }
cda-plugin-security = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "ed58d5f9524f483c3f9409a1a79a12ab8261568c" }

# ---- common crates ----
async-trait = "0.1.89"
thiserror = "2.0.17"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.48.0", default-features = false }
bytes = "1"
clap = "4.6.1"
toml = "0.9.8"

# ---- networking crates ----
reqwest = { version = "0.12.24", default-features = false }

# ---- tracing & logging crates ----
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }

[workspace.lints.clippy]
# enable pedantic
pedantic = { level = "warn", priority = -1 }
## exclude some too pedantic lints for now
similar_names = "allow"

# additional lints
clone_on_ref_ptr = "warn"
indexing_slicing = "deny"
unwrap_used = "deny"
arithmetic_side_effects = "deny"
separated_literal_suffix = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }

[patch.crates-io]
aide = { git = "https://github.com/alexmohr/aide.git", rev = "56355cb" }
flatbuffers = { git = "https://github.com/alexmohr/flatbuffers.git", rev = "0ba3307d" }
