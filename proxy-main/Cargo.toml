[package]
name = "proxy-main"
version.workspace = true
edition.workspace = true
publish = false
description = "UDS to SOVD proxy with DoIP server"
homepage.workspace = true
license.workspace = true

[[bin]]
name = "uds2sovdproxy"
path = "src/main.rs"

[dependencies]
proxy-core = { workspace = true }
proxy-doip = { workspace = true }
proxy-sovd = { workspace = true }
cda-database = { workspace = true }
cda-interfaces = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter", "fmt", "registry", "ansi"] }

[lints]
workspace = true
